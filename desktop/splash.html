<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EverNothing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a2e;
    color: #f0e6ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .rainbow {
    position: fixed; top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg,#ff6eb4,#c084fc,#67e8f9,#6ee7b7,#fde68a,#fdba74,#ff6eb4);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
  .unicorn {
    font-size: 72px;
    animation: bounce 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px #ff6eb4);
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(90deg,#ff6eb4,#c084fc,#67e8f9,#fde68a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 16px 0 8px;
  }
  .status {
    color: #c084fc;
    font-size: 0.95rem;
    margin-top: 24px;
    letter-spacing: 1px;
  }
  .dots span {
    animation: blink 1.2s infinite;
    opacity: 0;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }
  .error {
    color: #f87171;
    background: rgba(248,113,113,.1);
    border: 1px solid #f87171;
    border-radius: 8px;
    padding: 12px 20px;
    margin-top: 20px;
    max-width: 500px;
    text-align: center;
    font-size: 0.85rem;
    white-space: pre-wrap;
  }
  .version { color: #6b3fa0; font-size: 0.75rem; margin-top: 40px; }
</style>
</head>
<body>
<div class="rainbow"></div>
<div class="unicorn">&#x1F984;</div>
<h1>EverNothing</h1>
<div class="status" id="status">
  Starting server<span class="dots"><span>.</span><span>.</span><span>.</span></span>
</div>
<div id="error-box"></div>
<div class="version">v1.0.0</div>

<script>
  // Show error message if passed via query string
  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  if (err) {
    document.getElementById('status').textContent = 'Failed to start server';
    const box = document.getElementById('error-box');
    box.className = 'error';
    box.textContent = err;
  }
</script>
</body>
</html>
